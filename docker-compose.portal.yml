services:
  portal:
    build: .
    restart: unless-stopped
    hostname: ${PORTAL_HOSTNAME:?required}
    env_file:
      - .env
    expose:
      - "8000"
    logging:
      driver: syslog
      options:
        syslog-address: "udp://syslog.internal:514"
        syslog-format: "rfc3164"
        tag: "${PORTAL_HOSTNAME}-guest-portal-webservice"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    hostname: ${PORTAL_HOSTNAME:?required}
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - portal
    logging:
      driver: syslog
      options:
        syslog-address: "udp://syslog.internal:514"
        syslog-format: "rfc3164"
        tag: "${PORTAL_HOSTNAME}-guest-portal-nginx"
